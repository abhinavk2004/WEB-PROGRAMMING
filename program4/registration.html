<html>
<head>
<title>Registration form</title>
</head>
<body>
<form style="background-color:#9eafe2;
padding:20px;width:80%;margin:auto;">
<h3 align="center">Registration form</h3>
<table cellpadding="8">
<tr>
<td>Full name</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Mobile number</td>
<td><input type="number"></td>
</tr>
<tr>
<td>Email id</td>
<td><input type="email"></td>
</tr>
<tr>
<td>Age</td>
<td><input type="number"></td>
</tr>
<tr>
<td>Gender</td>
<td><input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others
</td>
</tr>
<tr>
<td>Date of birth</td>
<td><input type="date"></td>
</tr>
<td>Address</td>
<td><textarea rows="7"></textarea></td>
</tr>
<tr>
<td>Current Study</td>
<td>
<select>
<option>Btech</option>
<option>Bca</option>
<option>Mca</option>
</select>
</td>
</tr>
<tr>
<td>Department</td>
<td>
<select>
<option>Cs</option>
<option>It</option>
<option>Ec</option>
</select>
</td>
</tr>
<tr>
<td>Upload cv</td>
<td><input type="file"></td>
</tr>
<tr>
<td>programming languages</td>
<td>
<input type="checkbox">HTML
<input type="checkbox">ReactJS
<input type="checkbox">CSS
<input type="checkbox">Flutter
</td>
</tr>
<tr>
<td>languages</td>
<td>
<input type="checkbox">English
<input type="checkbox">Malayalam
<input type="checkbox">Hindi
</td>
</tr>
<tr>
<td><input type="Submit"></td>
<td><input type="Reset"></td>
</tr>
</table>
</form>
</body>
</html>
